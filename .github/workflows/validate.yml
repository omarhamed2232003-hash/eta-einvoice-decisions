name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate the dataset
        run: npm run validate
      - name: Check the CSV is in sync
        run: node scripts/build-csv.mjs --check
      - name: Run the tests
        run: npm test
